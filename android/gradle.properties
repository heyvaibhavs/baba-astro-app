org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
android.useAndroidX=true
android.enableJetifier=true

# Build performance optimizations
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.configureondemand=true
android.enableR8=true
android.enableDexingArtifactTransform=true
org.gradle.caching=true

# Safely enable configuration cache (Gradle 7+). If issues arise, comment out.
org.gradle.configuration-cache=true

# Reduce Kotlin compile daemon restarts
kotlin.incremental=true
kotlin.code.style=official

# Suppress Jetifier warnings during release builds
android.jetifier.ignorelist=bcprov-jdk15on

org.gradle.configuration-cache=false
